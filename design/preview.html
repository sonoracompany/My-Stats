<title>My Stats do Zero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: um iPhone no centro; seletor de tela acima.
   Direção "Ardósia": uma única família de cor (azul-ardósia, do mais fundo ao mais claro), tom médio — nem preto, nem branco.
   Organização no estilo do app Saúde: seções com título, linhas com ícone + rótulo + valor, tudo alinhado na mesma grade. */
:root {
  --s0: #1d2230;   /* fundo da tela: grafite-azulado, não preto */
  --s1: #272e3e;   /* cartões */
  --s2: #323a4c;   /* cartão elevado, campos */
  --s3: #434c60;   /* trilhos */
  --line: rgb(255 255 255 / 0.07);
  --text: #eef2f5; --muted: #a3b0bc; --faint: #75838f;
  --accent: #5b8cff; --accent-2: #8fb0ff; --accent-ink: #fff;
  /* paleta por assunto, como no app Saúde: cada métrica tem a sua cor, sempre a mesma */
  --gem: #3ec6e0; --money: #34c77b; --time: #ff9f43; --fans: #ff5e8a; --view: #8a7dff; --gold: #f5c542; --live: #c56bff; --red: #ff6b6b;
  --up: #34c77b; --down: #ff6b6b;
  --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --r-card: 26px; --r-pill: 999px;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #161a24; color: var(--text); font: 15px/1.45 var(--sf); }
button { font: inherit; color: inherit; cursor: pointer; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.page { max-width: 900px; margin: 0 auto; padding-block: 20px 60px; display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.controls { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 10px; }
.controls h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.controls p { margin: 0; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--s3); background: var(--s1); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.phone { width: 390px; max-width: 100%; height: 820px; border-radius: 48px; padding: 11px; background: #11161b; box-shadow: 0 30px 70px rgb(0 0 0 / 0.5), 0 0 0 1px #34404b; }
.screen { position: relative; height: 100%; border-radius: 38px; overflow: hidden; background: radial-gradient(90% 45% at 100% 0%, rgb(197 107 255 / .28), transparent 70%), radial-gradient(80% 40% at 0% 35%, rgb(62 198 224 / .16), transparent 70%), radial-gradient(90% 50% at 100% 85%, rgb(91 140 255 / .2), transparent 70%), linear-gradient(180deg, #232a44, #1d2232 50%, #1a2030); }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 112px; height: 31px; border-radius: 20px; background: #000; z-index: 9; }
.status { position: absolute; inset: 0 0 auto; height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; font-size: 14px; font-weight: 700; z-index: 8; background: linear-gradient(rgb(35 42 68 / .95) 55%, transparent); }
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 56px 16px 112px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.v { display: flex; flex-direction: column; gap: 22px; }

/* Cabeçalho */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 4px 4px 0; }
.top small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
.top h1 { margin: 2px 0 0; font-size: 32px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; }
.acts { display: flex; gap: 8px; }
.ibtn { height: 38px; min-width: 38px; border-radius: var(--r-pill); border: 0; background: var(--s1); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; font-size: 13.5px; font-weight: 700; color: var(--text); }
.ibtn svg { width: 18px; height: 18px; color: var(--accent); }
.ibtn.solid { background: var(--accent); color: var(--accent-ink); padding: 0; width: 38px; } .ibtn.solid svg { color: var(--accent-ink); }

/* Seções */
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; }
.sec-h h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.sec-h span { font-size: 13px; color: var(--accent); font-weight: 600; }

/* Cartão de destaque: só tons do mesmo azul */
.feature { background: radial-gradient(120% 90% at 100% 0%, rgb(197 107 255 / .55), transparent 60%), radial-gradient(90% 80% at 0% 100%, rgb(62 198 224 / .35), transparent 60%), linear-gradient(140deg, #3b3f9e, #2b3a7a 55%, #253358); box-shadow: 0 18px 40px -18px rgb(91 92 255 / .6); border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.feature .k { display: flex; align-items: center; gap: 8px; color: rgb(255 255 255 / .8); font-size: 13px; font-weight: 600; }
.feature .k i { width: 22px; height: 22px; border-radius: 7px; background: rgb(255 255 255 / .2); color: #fff; display: grid; place-items: center; }
.feature .k i svg { width: 14px; height: 14px; stroke-width: 2.2; }
.feature .k em { margin-left: auto; font-style: normal; font-size: 12px; color: #fff; background: rgb(255 255 255 / .16); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.feature .big { font-size: 40px; font-weight: 700; letter-spacing: -0.035em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.feature .sub { color: rgb(255 255 255 / .75); font-size: 13px; }
.feature .row3 { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; padding-top: 14px; border-top: 1px solid rgb(255 255 255 / .16); }
.feature .row3 div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.feature .row3 span { display: block; font-size: 11.5px; color: rgb(255 255 255 / .7); font-weight: 600; }
.feature .row3 b { font-size: 16px; }

/* Grupo de linhas (estilo Ajustes/Saúde) */
.group { background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .08); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: var(--r-card); overflow: hidden; }
.line { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; }
.line + .line { box-shadow: inset 58px 1px 0 -57px var(--line); border-top: 1px solid var(--line); }
.line .ic { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 100%, #fff 18%), var(--c)); color: #fff; display: grid; place-items: center; }
.line .ic svg { width: 16px; height: 16px; }
.line .t b { display: block; font-size: 14.5px; font-weight: 600; }
.line .t span { font-size: 12px; color: var(--muted); }
.line .r { text-align: right; } .line .r b { display: block; font-size: 15px; } .line .r span { font-size: 11.5px; color: var(--muted); }
.line .meter { grid-column: 2 / -1; height: 4px; border-radius: 9px; background: var(--s2); overflow: hidden; margin-top: -2px; }
.line .meter i { display: block; height: 100%; background: var(--c); border-radius: inherit; }

/* Grade 2×N */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .08); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 3px 0 -1px var(--c); border-radius: var(--r-card); padding: 14px 15px; display: flex; flex-direction: column; gap: 6px; min-height: 96px; }
.tile .lab { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tile .lab { color: var(--muted) !important; } .tile .lab svg { width: 22px; height: 22px; padding: 4px; border-radius: 7px; background: var(--c); color: #fff; stroke-width: 2.2; } .tile b { color: #fff !important; } .tile small.up, .tile small.down { align-self: flex-start; padding: 1px 7px; border-radius: 99px; background: color-mix(in srgb, currentColor 16%, transparent); }
.tile b { font-size: 21px; margin-top: auto; }
.tile small { font-size: 11.5px; font-weight: 700; }
.up { color: var(--up); } .down { color: var(--down); } .acc { color: var(--accent); } .mut { color: var(--muted); }

/* Controles */
.pillbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--s1); border-radius: var(--r-pill); padding: 3px; }
.pillbar button { border: 0; background: none; border-radius: var(--r-pill); padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.pillbar button.on { background: var(--s3); color: var(--text); }
.month { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; background: var(--s1); border-radius: var(--r-pill); padding: 3px; text-align: center; }
.month button { border: 0; background: none; height: 34px; border-radius: 50%; color: var(--accent); }
.month button svg { width: 18px; height: 18px; }
.month b { display: block; font-size: 15px; } .month span { font-size: 11.5px; color: var(--muted); }

/* Gráficos */
.chartcard { background: var(--s1); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.chartcard .hd { display: flex; justify-content: space-between; align-items: baseline; }
.chartcard .hd b { font-size: 14.5px; } .chartcard .hd span { font-size: 12px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; position: relative; }
.bars i { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--s3); }
.bars i.on { background: linear-gradient(var(--gem), var(--accent)); } .bars i.top { background: linear-gradient(var(--gold), var(--time)); }
.bars .avg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); opacity: .6; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
.track { height: 8px; border-radius: 9px; background: var(--s2); overflow: hidden; } .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--live)); border-radius: inherit; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days i { aspect-ratio: 1; border-radius: 50%; background: var(--s2); display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: var(--faint); }
.days i.on { background: linear-gradient(160deg, var(--time), var(--red)); color: var(--accent-ink); }
.weeks { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; } .weeks i { height: 22px; border-radius: 6px; background: var(--s2); } .weeks i.on { background: var(--money); } .weeks i.today { box-shadow: 0 0 0 2px var(--s0), 0 0 0 3.5px var(--accent-2); }

/* Formulários */
.form { background: var(--s1); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .fgrid .w { grid-column: 1 / -1; }
.f span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 5px 12px; }
.f div { height: 44px; border-radius: var(--r-pill); background: var(--s2); display: flex; align-items: center; padding: 0 16px; font-size: 15px; }
.f div.auto { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cta { height: 50px; border-radius: var(--r-pill); border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; }
.cta.ghost { background: var(--s2); color: var(--text); }
.kv { display: flex; justify-content: space-between; font-size: 14px; } .kv span { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; } td { padding: 10px 0; border-top: 1px solid var(--line); } td:last-child { text-align: right; } tr.me td { color: var(--accent); font-weight: 700; }

/* Barra de abas */
.tabbar { position: absolute; left: 14px; right: 14px; bottom: 16px; height: 64px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--s2) 88%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; box-shadow: 0 12px 30px -10px rgb(0 0 0 / 0.45); z-index: 6; }
.tabbar button { border: 0; background: none; border-radius: var(--r-pill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); }
.tabbar button.on { background: var(--s0); color: var(--tc, var(--accent)); }

/* Janelas */
.scrim { position: absolute; inset: 0; background: rgb(15 20 25 / 0.5); z-index: 10; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--s0); border-radius: 30px 30px 0 0; padding: 8px 16px 28px; z-index: 11; display: flex; flex-direction: column; gap: 14px; animation: up 380ms var(--ease); }
.sheet .grab { width: 38px; height: 5px; border-radius: 9px; background: var(--s3); margin: 2px auto 0; }
.sheet .sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; } .sheet .sh b { font-size: 17px; } .sheet .sh button { border: 0; background: none; color: var(--accent); font-size: 16px; font-weight: 600; justify-self: start; } .sheet .sh button + b + button, .sheet .sh .end { justify-self: end; font-weight: 700; }
@keyframes up { from { transform: translateY(100%); } }

@media (prefers-reduced-motion: no-preference) { .v > * { animation: rise 460ms var(--ease) both; } .v > *:nth-child(2) { animation-delay: 40ms } .v > *:nth-child(3) { animation-delay: 80ms } .v > *:nth-child(n+4) { animation-delay: 120ms } }
@keyframes rise { from { opacity: 0.001; transform: translateY(8px); } }

/* ===== Versão "Lavanda": inspirada nas referências — fundo lavanda-acinzentado, cartões brancos, destaque roxo vivo ===== */
:root {
  --s0: #efedf4; --s1: #ffffff; --s2: #f3f0f8; --s3: #e2dcec;
  --line: rgb(40 20 70 / .08); --text: #1c1530; --muted: #6f6880; --faint: #a59fb3;
  --accent: #8a2be2; --accent-2: #b46cf5; --accent-ink: #fff;

}

.tile { box-shadow: 0 1px 2px rgb(40 20 70 / .05), 0 8px 24px -12px rgb(60 30 110 / .18); }
.tile b { color: var(--text) !important; }

/* rodada 3: cor principal em variáveis (azul royal / vermelho escuro), fundo com degradê e doodles sutis */
:root { --p1: #2a5aa8; --p2: #1c4486; --p3: #112d5e; --pg: 32 72 140;
  --bg1: #aab6ca; --bg2: #8f9db5; --card: #dfe5ee; --s2: #d2dae6; --s3: #b3bfd1; --muted: #4c5770; --text: #111a2c; --accent: #1c4486; --accent-2: #4f7fc9; }
body.red { --p1: #c8323f; --p2: #9e1c2a; --p3: #6e101b; --pg: 200 50 63;
  --bg1: #e2d4d6; --bg2: #d3c2c5; --card: #f2e9ea; --s2: #ecdfe1; --s3: #d6c3c6; --muted: #6e585c; --text: #2a1418; --accent: #9e1c2a; --accent-2: #d9505d; }

/* ===== Animações ===== */
/* 10 · brilho que atravessa o card principal */
.feature.hero::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; border-radius: inherit;
  background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .16) 48%, rgb(255 255 255 / .05) 54%, transparent 62%);
  background-size: 250% 100%; background-position: 130% 0; animation: shine 7s ease-in-out 1.2s infinite; }
@keyframes shine { 0% { background-position: 130% 0; } 22%, 100% { background-position: -30% 0; } }
/* 3 · barras do gráfico crescendo em onda */
.bars.grow i { transform-origin: bottom; animation: grow .7s var(--ease) both; animation-delay: calc(var(--i) * 22ms); }
@keyframes grow { from { transform: scaleY(0); } }
/* 5 · troféu de recorde balança e brilha */
.wiggle { animation: wiggle .9s ease-in-out .5s 2; transform-origin: 50% 80%; position: relative; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg) scale(1.1); } 45% { transform: rotate(12deg) scale(1.1); } 70% { transform: rotate(-6deg); } }
.rec.new .rt { overflow: hidden; position: relative; }
.rec.new .rt::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(110deg, transparent 40%, rgb(255 255 255 / .8) 50%, transparent 60%); transform: translateX(-100%); animation: glint 1.2s ease .8s 2; }
@keyframes glint { to { transform: translateX(100%); } }
/* 6 · foguinho da sequência acende */
.flare { animation: flare 1.4s ease-out .4s 2; }
@keyframes flare { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgb(226 116 47 / 0); } 35% { transform: scale(1.25); box-shadow: 0 0 0 8px rgb(226 116 47 / .25), 0 0 18px 4px rgb(255 170 90 / .6); } }
/* 7 · conteúdo entra pelo lado da aba escolhida */
.slide-l { animation: slidel .42s var(--ease); } .slide-r { animation: slider .42s var(--ease); }
@keyframes slidel { from { transform: translateX(-28px); opacity: .001; } } @keyframes slider { from { transform: translateX(28px); opacity: .001; } }
/* 8 · salvar vira check */
.saved { pointer-events: none; }
.saved svg.ok { width: 22px; height: 22px; stroke-width: 2.6; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
/* 9 · puxar pra atualizar */
.ptr { position: absolute; left: 50%; top: 58px; z-index: 7; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; display: grid; place-items: center; background: var(--card, #fff); color: var(--accent); box-shadow: 0 6px 16px -6px rgb(15 42 32 / .4); opacity: 0; transform: translateY(-20px) scale(.6); }
.ptr svg { width: 20px; height: 20px; } .ptr.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* 4 · meta batida */
.party { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
.party svg { position: absolute; top: -40px; color: var(--copper, #e2742f); stroke-width: 1.6; animation: confetti linear forwards; }
.party svg .d { fill-opacity: .5; }
.party svg:nth-child(3n) { color: var(--lime, #c6f59a); } .party svg:nth-child(4n) { color: #fff; }
@keyframes confetti { to { transform: translate(var(--dx), 900px) rotate(var(--r)); } }
.toastx { position: absolute; left: 24px; right: 24px; top: 40%; z-index: 21; padding: 18px; border-radius: 24px; text-align: center; color: #fff;
  background: linear-gradient(160deg, #f08a45, #c25a1c); box-shadow: 0 24px 50px -16px rgb(194 90 28 / .8); animation: pop .6s cubic-bezier(.34,1.56,.64,1) both, out .4s ease 3.4s forwards; }

@keyframes pop { from { transform: scale(.6); opacity: 0; } } @keyframes out { to { transform: scale(.9); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .feature.hero::after, .bars.grow i, .wiggle, .rec.new .rt::after, .flare, .slide-l, .slide-r, .party svg { animation: none !important; } }

// Parallax: só mexe enquanto rola; com "Reduzir movimento" ligado fica parado
{
  const sc = document.getElementById('scroll'), screen = document.querySelector('.screen')
  const still = matchMedia('(prefers-reduced-motion: reduce)')
  let ticking = false
  sc.addEventListener('scroll', () => {
    if (still.matches || ticking) return
    ticking = true
    requestAnimationFrame(() => {
      const y = sc.scrollTop
      screen.style.setProperty('--dx', `${(-y * 0.18) % 180}px`)
      screen.style.setProperty('--dy', `${(-y * 0.07) % 180}px`)
      ticking = false
    })
  }, { passive: true })
}

const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const ORDER = ['inicio', 'lives', 'estatisticas', 'saldo', 'missoes', 'limite', 'regras', 'icones']
let lastTab = 'inicio'
// 1 · contador subindo
function countUp(el) {
  if (!el) return
  const txt = el.textContent, target = Number(txt.replace(/\D/g, '')), pre = txt.match(/^\D*/)[0]
  if (!target || still()) return
  const t0 = performance.now(), dur = 900
  const step = t => { const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3)
    el.textContent = pre + Math.round(target * e).toLocaleString('pt-BR'); if (p < 1) requestAnimationFrame(step); else el.textContent = txt }
  requestAnimationFrame(step)
}

function lxAnim() {
  const arc = document.getElementById('lxArc'); if (!arc) return
  const dot = document.getElementById('lxDot'), num = document.getElementById('lxN'), pct = document.getElementById('lxP')
  const target = 0.785, total = 1963400, L = arc.getTotalLength(), t0 = performance.now(), dur = 1600
  const ease = t => 1 - Math.pow(1 - t, 4)
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches
  const step = now => {
    const k = still ? 1 : Math.min((now - t0) / dur, 1), p = target * ease(k)
    arc.setAttribute('stroke-dasharray', `${p * 100} 100`)
    const pt = arc.getPointAtLength(L * p); dot.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`)
    num.textContent = Math.round(total * ease(k)).toLocaleString('pt-BR'); pct.textContent = Math.round(79 * ease(k)) + '%'
    if (k < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}
